<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuniCharge - شحن الرصيد بسهولة</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1c24;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #16222a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 28px;
      line-height: 1.7;
    }
    h1 {
      margin-top: 0;
      color: #64ffda;
      font-size: 24px;
    }
    p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TuniCharge</h1>
    <p>تطبيق TuniCharge يساعد المستخدمين على مسح بطاقات شحن الهاتف الجوال في تونس بسرعة وسهولة.</p>
    <p>سياسة الخصوصية: لا يقوم التطبيق ببيع بيانات المستخدمين، وتُستخدم البيانات الضرورية لتشغيل وظائف التطبيق والإعلانات وفق القوانين المعمول بها.</p>
  </div>
</body>
</html>
